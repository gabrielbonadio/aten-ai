<div class="min-h-screen bg-gradient-to-b from-slate-50 to-white flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
      <div class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-900">Nova senha</h1>
        <p class="text-slate-600 mt-1">Defina uma senha forte para sua conta.</p>
      </div>

      <form *ngIf="!tokenMissing" [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nova senha</label>
          <input
            type="password"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Mín. 8 caracteres, com maiúscula, número e símbolo"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400"
          />
          <p
            *ngIf="form.controls.password.touched && form.controls.password.invalid"
            class="mt-1 text-sm text-red-600"
          >
            Use no mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial.
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Confirmar senha</label>
          <input
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="Repita a senha"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400"
          />
          <p
            *ngIf="
              (form.controls.confirmPassword.touched || form.touched) &&
              form.hasError('passwordsMismatch')
            "
            class="mt-1 text-sm text-red-600"
          >
            As senhas não coincidem.
          </p>
        </div>

        <div
          *ngIf="successMessage"
          class="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-800"
          role="status"
        >
          {{ successMessage }}
        </div>

        <div
          *ngIf="errorMessage"
          class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
          role="alert"
        >
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          [disabled]="loading || !!successMessage"
          class="w-full rounded-xl bg-slate-900 text-white px-4 py-2.5 font-medium hover:bg-slate-800 disabled:opacity-60 disabled:cursor-not-allowed transition"
        >
          <span *ngIf="!loading">Salvar nova senha</span>
          <span *ngIf="loading">Salvando...</span>
        </button>
      </form>

      <div *ngIf="tokenMissing" class="space-y-4">
        <div
          class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
          role="alert"
        >
          {{ errorMessage }}
        </div>
        <a
          routerLink="/forgot-password"
          class="inline-flex w-full justify-center rounded-xl bg-slate-900 text-white px-4 py-2.5 font-medium hover:bg-slate-800 transition"
        >
          Solicitar novo link
        </a>
      </div>

      <p class="text-center text-sm text-slate-600 mt-5">
        <a routerLink="/login" class="font-medium text-slate-900 underline underline-offset-2 hover:no-underline">
          Voltar ao login
        </a>
      </p>
    </div>
  </div>
</div>
