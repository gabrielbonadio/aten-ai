<div class="min-h-screen bg-gradient-to-b from-slate-50 to-white flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-8">
      <div class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-900">Entrar</h1>
        <p class="text-slate-600 mt-1">Acesse sua conta para continuar.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="voce@exemplo.com"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400"
          />
          <p
            *ngIf="form.controls.email.touched && form.controls.email.invalid"
            class="mt-1 text-sm text-red-600"
          >
            Informe um e-mail válido.
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Sua senha"
            class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400"
          />
          <p
            *ngIf="form.controls.password.touched && form.controls.password.invalid"
            class="mt-1 text-sm text-red-600"
          >
            Informe sua senha (mín. 6 caracteres).
          </p>
        </div>

        <div
          *ngIf="errorMessage"
          class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
          role="alert"
        >
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full rounded-xl bg-slate-900 text-white px-4 py-2.5 font-medium hover:bg-slate-800 disabled:opacity-60 disabled:cursor-not-allowed transition"
        >
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading">Entrando...</span>
        </button>
      </form>

      <p class="text-center text-sm text-slate-600 mt-5">
        Ainda não tem conta?
        <a routerLink="/signup" class="font-medium text-slate-900 underline underline-offset-2 hover:no-underline">
          Criar conta
        </a>
      </p>
    </div>

    <p class="text-center text-xs text-slate-500 mt-4">
      Ao entrar, você concorda com as políticas da clínica.
    </p>
  </div>
</div>
