<app-auth-page-shell>
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">Entrar</h1>
    <p class="mt-1 text-zinc-600 dark:text-zinc-400">Acesse sua conta para continuar.</p>
  </div>

  <div
    *ngIf="sessionNotice"
    class="mb-4 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-900 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-100"
    role="status"
  >
    {{ sessionNotice }}
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label [class]="labelClass" for="login-email">E-mail</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        spellcheck="false"
        placeholder="voce@exemplo.com"
        [class]="inputClass"
      />
      <p
        *ngIf="form.controls.email.touched && form.controls.email.invalid"
        class="mt-1 text-sm text-red-600 dark:text-red-400"
      >
        Informe um e-mail válido.
      </p>
    </div>

    <div>
      <div class="mb-1 flex items-center justify-between">
        <label [class]="labelClass + ' mb-0'" for="login-password">Senha</label>
        <a
          routerLink="/forgot-password"
          class="text-xs font-medium text-emerald-700 underline underline-offset-2 hover:text-emerald-800 hover:no-underline dark:text-emerald-400"
        >
          Esqueci a senha
        </a>
      </div>
      <div class="relative">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Sua senha"
          [class]="inputClass + ' pr-11'"
        />
        <button
          type="button"
          class="absolute right-2 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-lg text-zinc-500 hover:bg-zinc-100 hover:text-zinc-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/40 dark:hover:bg-zinc-800 dark:hover:text-zinc-200"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        >
          <lucide-icon
            [name]="showPassword() ? 'eye-off' : 'eye'"
            class="h-4 w-4"
            aria-hidden="true"
          ></lucide-icon>
        </button>
      </div>
      <p
        *ngIf="form.controls.password.touched && form.controls.password.invalid"
        class="mt-1 text-sm text-red-600 dark:text-red-400"
      >
        Informe sua senha (mín. 6 caracteres).
      </p>
    </div>

    <div
      *ngIf="errorMessage"
      class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-500/30 dark:bg-red-950/40 dark:text-red-200"
      role="alert"
    >
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading" [class]="primaryBtnClass">
      <span *ngIf="!loading">Entrar</span>
      <span *ngIf="loading">Entrando…</span>
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-zinc-600 dark:text-zinc-400">
    Ainda não tem conta?
    <a
      routerLink="/signup"
      class="font-medium text-emerald-700 underline underline-offset-2 hover:no-underline dark:text-emerald-400"
    >
      Criar conta
    </a>
  </p>
</app-auth-page-shell>
