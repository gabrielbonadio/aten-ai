<app-auth-page-shell>
  <div class="mb-6">
    <h1 class="text-2xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">
      Recuperar senha
    </h1>
    <p class="mt-1 text-zinc-600 dark:text-zinc-400">
      Informe seu e-mail e enviaremos um link para criar uma nova senha.
    </p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label [class]="labelClass" for="forgot-email">E-mail</label>
      <input
        id="forgot-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        spellcheck="false"
        placeholder="voce@clinica.com"
        [class]="inputClass"
      />
      <p
        *ngIf="form.controls.email.touched && form.controls.email.invalid"
        class="mt-1 text-sm text-red-600 dark:text-red-400"
      >
        Informe um e-mail válido.
      </p>
    </div>

    <div
      *ngIf="successMessage"
      class="rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-800 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-100"
      role="status"
    >
      {{ successMessage }}
    </div>

    <div
      *ngIf="errorMessage"
      class="rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700 dark:border-red-500/30 dark:bg-red-950/40 dark:text-red-200"
      role="alert"
    >
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loading" [class]="primaryBtnClass">
      <span *ngIf="!loading">Enviar link</span>
      <span *ngIf="loading">Enviando…</span>
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-zinc-600 dark:text-zinc-400">
    Lembrou a senha?
    <a
      routerLink="/login"
      class="font-medium text-emerald-700 underline underline-offset-2 hover:no-underline dark:text-emerald-400"
    >
      Voltar ao login
    </a>
  </p>
</app-auth-page-shell>
