@if (open() && record(); as r) {
  <div
    class="fixed inset-0 z-[60] flex items-end justify-center bg-zinc-900/50 p-4 backdrop-blur-[2px] sm:items-center"
    role="dialog"
    aria-modal="true"
    aria-labelledby="mr-detail-title"
  >
    <div
      class="max-h-[min(92vh,80vh)] w-full max-w-lg overflow-y-auto rounded-2xl border border-zinc-200/80 bg-white shadow-xl dark:border-zinc-700 dark:bg-zinc-900"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-start justify-between gap-4 border-b border-zinc-100 px-6 py-4 dark:border-zinc-800">
        <div class="min-w-0">
          <h2 id="mr-detail-title" class="text-lg font-semibold text-zinc-900 dark:text-zinc-50">Prontuário</h2>
          <p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">
            {{ formatDate(r) }} · {{ vetName(r) }}
          </p>
        </div>
        <button
          type="button"
          class="grid h-9 w-9 shrink-0 place-items-center rounded-xl border border-zinc-200 text-zinc-600 hover:bg-zinc-50 dark:border-zinc-700 dark:text-zinc-300 dark:hover:bg-zinc-800"
          (click)="close()"
          aria-label="Fechar"
        >
          <lucide-icon name="x" class="h-4 w-4"></lucide-icon>
        </button>
      </div>

      <div class="space-y-5 px-6 py-5 text-sm">
        <div>
          <div class="text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Sintomas</div>
          <p class="mt-2 whitespace-pre-wrap text-zinc-800 dark:text-zinc-200">{{ r.symptoms || '—' }}</p>
        </div>
        <div>
          <div class="text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Diagnóstico</div>
          <p class="mt-2 whitespace-pre-wrap text-zinc-800 dark:text-zinc-200">{{ r.diagnosis || '—' }}</p>
        </div>
        <div>
          <div class="text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Prescrição</div>
          <p class="mt-2 whitespace-pre-wrap text-zinc-800 dark:text-zinc-200">{{ r.prescription || '—' }}</p>
        </div>
        <div
          class="flex items-center justify-between rounded-xl border border-zinc-100 bg-zinc-50 px-4 py-3 dark:border-zinc-800 dark:bg-zinc-950/50"
        >
          <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">Peso na data</span>
          <span class="font-semibold text-zinc-900 dark:text-zinc-50">{{ weightLabel(r) }}</span>
        </div>
      </div>
    </div>
  </div>
}
